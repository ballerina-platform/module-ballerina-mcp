fixes:
  - "io/ballerina/stdlib/mcp/plugin/::./compiler-plugin/src/main/java/io/ballerina/stdlib/mcp/plugin/"
  - "ballerina/mcp/**/::../ballerina/"
  # The v2 module's sources appear under its encoded module name in the ballerina-tests reports.
  - "ballerina/mcp&0046v2/**/::../ballerina/modules/v2/"
  # Since Ballerina 2201.14, the module coverage report places object methods, lambdas and module-level
  # variable initializers under synthetic packages (e.g. `ballerina/values`). Map them back to the sources.
  - "ballerina/values/::ballerina/"
  - "ballerina/lambdas/::ballerina/"
  - "ballerina/global_vars/::ballerina/"
  - "ballerina/constants/::ballerina/"
  - "ballerina/typedescs/::ballerina/"
  - "ballerina/modules/v2/values/::ballerina/modules/v2/"
  - "ballerina/modules/v2/lambdas/::ballerina/modules/v2/"
  - "ballerina/modules/v2/global_vars/::ballerina/modules/v2/"
  - "ballerina/modules/v2/constants/::ballerina/modules/v2/"
  - "ballerina/modules/v2/typedescs/::ballerina/modules/v2/"

ignore:
  - "ballerina-tests"

coverage:
  precision: 2
  round: down
  range: "60...80"
  status:
    project:
      default:
        target: 80
