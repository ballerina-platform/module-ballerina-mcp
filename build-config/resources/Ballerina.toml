[package]
org = "ballerina"
name = "mcp"
version = "@toml.version@"
authors = ["Ballerina"]
keywords = ["mcp", "Type/Connector", "Type/Trigger", "Name/MCP", "Area/AI & Machine Learning"]
repository = "https://github.com/ballerina-platform/module-ballerina-mcp"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.14.0"
include = ["metadata/**"]

[platform.java25]
graalvmCompatible = true

[[platform.java25.dependency]]
groupId = "io.ballerina.stdlib."
artifactId = "mcp-native"
version = "@toml.version@"
path = "../native/build/libs/mcp-native-@project.version@.jar"
